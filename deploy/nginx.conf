# UniMais Hub — Nginx na VPS da DreamHost.
# Copie para /etc/nginx/sites-available/hub e ajuste server_name e os caminhos.
# Certificado: certbot --nginx -d hub.unimais.edu.br (Let's Encrypt).

limit_req_zone $binary_remote_addr zone=hub_auth:10m rate=10r/m;

upstream hub_api {
  server 127.0.0.1:3001;
  keepalive 16;
}

server {
  listen 80;
  server_name hub.unimais.edu.br;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name hub.unimais.edu.br;

  ssl_certificate     /etc/letsencrypt/live/hub.unimais.edu.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hub.unimais.edu.br/privkey.pem;

  root /var/www/unimais-hub/apps/web/dist;
  index index.html;
  # Imagens coladas: até 5 MB (a API confere o limite e o tipo real do arquivo).
  client_max_body_size 6m;

  # Cabeçalhos de segurança (RNF-02, RNF-03).
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Login e senha: limite por IP além do bloqueio por conta (RF-3.7).
  location /api/auth/ {
    limit_req zone=hub_auth burst=10 nodelay;
    proxy_pass http://hub_api;
    include /etc/nginx/proxy_params;
  }

  # Tempo real (SSE): sem buffer e com conexão longa.
  location = /api/events {
    proxy_pass http://hub_api;
    include /etc/nginx/proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://hub_api;
    include /etc/nginx/proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
  }

  # Arquivos com hash no nome: cache longo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: toda rota da interface cai no index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
