name: unimais-hub

services:
  db:
    image: postgres:16
    container_name: unimais-hub-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: unimais_hub
      TZ: America/Sao_Paulo
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d unimais_hub']
      interval: 5s
      timeout: 5s
      retries: 10

  # Captura os e-mails enviados em desenvolvimento: http://localhost:8025
  mail:
    image: axllent/mailpit:v1.27
    container_name: unimais-hub-mail
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
